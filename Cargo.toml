[package]
name = "app-project"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "app", "common", "entity", "errors", "messaging", "migration"]

[dependencies]
app.workspace = true
app-errors.workspace = true
actix-web.workspace = true
tokio.workspace = true
reqwest.workspace = true
common.workspace = true
serde.workspace = true
serde_json.workspace = true

[workspace.dependencies]
app = { path = "./app" }
app-errors = { path = "./errors" }
common = { path = "./common" }
migration = { path = "./migration" }
entity = { path = "./entity" }
messaging = { path = "./messaging" }
actix-web = "4.10.2"
thiserror = "2.0.12"
serde = "1.0.219"
serde_json = "1.0.140"
dotenv = "0.15.0"
tracing-actix-web = "0.7.18"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio = { version = "1.45.0", features = ["full"] }
sea-orm = { version = "1.1.11", features = [
  "debug-print",
  "sqlx-postgres",
  "macros",
  "runtime-tokio-rustls",
] }
async-trait = "0.1.88"
log = "0.4.27"
reqwest = { version = "0.12.15", features = ["json"] }
validator = { version = "0.20.0", features = ["derive"] }
chrono = "0.4.41"
argon2 = "0.5.3"
rand = "0.9.1"
futures-util = "0.3.31"
rdkafka = "0.37.0"
strum = { version = "0.27.1", features = ["derive"] }
askama = "0.14.0"
lettre = "0.11.15"
actix-cors = "0.7.1"
