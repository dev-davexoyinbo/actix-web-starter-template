<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Celeris</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f4; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              background-color: #ffffff;
              max-width: 600px;
              width: 100%;
              border-collapse: collapse;
              border: 1px solid #dddddd;
            "
          >
            <!-- Header -->
            <tr>
              <td
                align="center"
                style="padding: 20px; background-color: #0073e6; color: #ffffff"
              >
                <img
                  src="https://via.placeholder.com/150x50"
                  alt="Celeris Logo"
                  style="display: block; max-width: 150px; height: auto"
                />
              </td>
            </tr>
            <!-- Main Content -->
            <tr>
              <td style="padding: 20px; text-align: center; color: #333333">
                <h1 style="font-size: 24px; margin: 0">Welcome to Celeris</h1>
                <h1 style="font-size: 24px; margin: 0">Hello {{name}}</h1>
                <p style="font-size: 16px; line-height: 1.5; margin: 20px 0">
                  We're excited to have you on board! Explore our platform and
                  discover all the amazing features we have to offer.
                </p>
                <a
                  href="#"
                  style="
                    display: inline-block;
                    padding: 10px 20px;
                    background-color: #0073e6;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 5px;
                    font-size: 16px;
                  "
                >
                  Get Started
                </a>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px;
                  background-color: #f4f4f4;
                  text-align: center;
                  font-size: 12px;
                  color: #666666;
                "
              >
                <p style="margin: 0">
                  Celeris Inc. | 1234 Example Street, City, Country
                </p>
                <p style="margin: 5px 0">
                  <a href="#" style="color: #0073e6; text-decoration: none"
                    >Unsubscribe</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
