<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email - App</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f4; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              background-color: #ffffff;
              max-width: 600px;
              width: 100%;
              border-collapse: collapse;
              border: 1px solid #dddddd;
            "
          >
            <!-- Header -->
            <tr>
              <td
                align="center"
                style="padding: 20px; background-color: #0073e6; color: #ffffff"
              >
                <img
                  src="https://via.placeholder.com/150x50"
                  alt="App Logo"
                  style="display: block; max-width: 150px; height: auto"
                />
              </td>
            </tr>
            <!-- Main Content -->
            <tr>
              <td style="padding: 20px; text-align: center; color: #333333">
                <h1 style="font-size: 24px; margin: 0">Verify Your Email</h1>
                <p style="font-size: 16px; line-height: 1.5; margin: 20px 0">
                  Hi {{name}},<br />
                  Use the OTP below to verify your email address and activate
                  your account.
                </p>
                <p
                  style="
                    font-size: 32px;
                    font-weight: bold;
                    margin: 20px 0;
                    color: #0073e6;
                  "
                >
                  {{ otp }}
                </p>
                <p
                  style="
                    font-size: 14px;
                    line-height: 1.5;
                    margin: 20px 0;
                    color: #666666;
                  "
                >
                  This OTP is valid for the next 10 minutes. If you did not sign
                  up for App, please ignore this email.
                </p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px;
                  background-color: #f4f4f4;
                  text-align: center;
                  font-size: 12px;
                  color: #666666;
                "
              >
                <p style="margin: 0">
                  App Inc. | 1234 Example Street, City, Country
                </p>
                <p style="margin: 5px 0">
                  <a href="#" style="color: #0073e6; text-decoration: none"
                    >Unsubscribe</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
