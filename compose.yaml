version: "3"

services:
  watchtower:
    image: containrrr/watchtower
    command:
      - "--label-enable"
      - "--interval"
      - "60"
      - "--rolling-restart"
      - --cleanup=true
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json

  reverse-proxy:
    image: traefik:v3.1
    command:
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=dev.davexoyinbo@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    # TODO: Change this to the image from the registry
    # image: ghcr.io/work-mate/workmate-backend:prod
    restart: always
    deploy:
      mode: replicated
      replicas: 2
    env_file:
      - ./.env
    #    environment:
    #      DATABASE_URL: postgres://postgres:postgres@postgres_db:5432/declutter
    volumes:
      - ./:/app/
      - ./target:/app/target
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.declutter.rule=Host(`backend.workmatetech.io`)"
      - "traefik.http.routers.declutter.entrypoints=websecure"
      - "traefik.http.routers.declutter.tls.certresolver=myresolver"
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  db:
  letsencrypt:
